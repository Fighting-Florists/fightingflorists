<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Title Here - Fighting Florists</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: #fff8f7;
      color: #333;
      overflow-x: hidden;
    }

    h1, h2 {
      text-align: center;
    }

    p {
      text-align: center;
      max-width: 700px;
      margin: 1rem auto;
      line-height: 1.5;
    }

    section {
      padding: 4rem 1rem;
      position: relative;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #fdf0f4;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
      transition: top 0.3s;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    button {
      border: none;
      border-radius: 5px;
      padding: 0.7rem 1.5rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      background-color: #ffb6c1;
      color: #fff;
    }
    button:hover { opacity: 0.85; }

    /* Floating Ribbons */
    .floating {
      position: absolute;
      width: 60px;
      opacity: 0.8;
      animation: float 12s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); }
      100% { transform: translateY(-200px) rotate(360deg); }
    }

    /* Section Backgrounds */
    #hero { background-color: #ffe6f0; min-height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #content { background-color: #fff8f7; padding-bottom: 4rem; }

  </style>
</head>
<body>

  <!-- Navigation -->
  <nav id="navbar">
    <a href="index.html">Home</a>
    <a href="team.html">Team</a>
    <a href="donate.html">Donate</a>
    <a href="education.html">Education</a>
  </nav>

  <!-- Hero / Blog Title -->
  <section id="hero">
    <h1>Blog Title Here</h1>
    <p>Short summary or introduction to your blog post goes here.</p>
    <p class="date">Posted: XX XX, 202X</p>
    <!-- Floating Pink Ribbons -->
    <img src="images/pinkribbon.png" class="floating" style="left:10%; animation-duration:12s;">
    <img src="images/pinkribbon.png" class="floating" style="left:40%; animation-duration:15s;">
    <img src="images/pinkribbon.png" class="floating" style="left:70%; animation-duration:18s;">
  </section>

  <!-- Blog Content -->
  <section id="content">
    <p>Explain, educate, inspire!</p>
    <p>Second paragraph goes here.</p>
    <p>Continue adding more paragraphs.</p>

    <div style="text-align:center;">
      <button onclick="window.location.href='education.html'">Back to Education</button>
    </div>
  </section>

  <script>
    // Scroll nav hide/show
    let prevScrollpos = window.pageYOffset;
    window.onscroll = function() {
      let currentScrollPos = window.pageYOffset;
      document.getElementById("navbar").style.top = (prevScrollpos > currentScrollPos) ? "0" : "-80px";
      prevScrollpos = currentScrollPos;
    };
  </script>
<!-- Footer -->
<footer>
  &copy; 2025 Fighting Florists. All rights reserved.
</footer>

</body>
</html>
